services:
  - type: web
    name: panicproof
    runtime: node
    plan: free
    repo: https://github.com/marmar9615-cloud/panicproof
    branch: main
    buildCommand: npm ci && npm run render:build
    startCommand: npm run start:render
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4.1-mini
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
